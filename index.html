<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sunset Rider – SAM WORLD Racing Edition</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#1c1420;--fg:#fff3e2;--panel:rgba(28,20,32,.62);--accent:#ffb36b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1420;--fg:#fff3e2;--panel:rgba(28,20,32,.62)}}
:root[data-theme="dark"]{--bg:#1c1420;--fg:#fff3e2;--panel:rgba(28,20,32,.62)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;-webkit-text-size-adjust:100%;touch-action:none}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
canvas{display:block;width:100%;height:100%}

/* ===== HUD & OVERLAYS ===== */
#hud{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:right;text-shadow:0 2px 10px #0008;pointer-events:none;z-index:10}
#spd{font-size:64px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
#hud small{font-size:15px;opacity:.8}
#tag,#ctl{position:fixed;left:14px;background:var(--panel);padding:8px 12px;border-radius:8px;font-size:13px;pointer-events:none;backdrop-filter:blur(4px);z-index:10}
#tag{top:calc(12px + env(safe-area-inset-top,0px))}
#ctl{bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:min(400px,65vw);line-height:1.5;transition:opacity 1.2s}
#ov,#pz{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;z-index:40}
#ov{background:radial-gradient(circle at 50% 60%,#ff9a5a55,#1c1420ee 70%)}
#pz{display:none;background:#1c142099;font-size:34px;font-weight:700}
h1{margin:0;font-size:clamp(34px,8vw,64px);letter-spacing:.02em}
#ov p{margin:0 0 10px;opacity:.85}
button{font:inherit;font-size:18px;padding:12px 30px;border:0;border-radius:999px;background:var(--accent);color:#2a1424;font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}

#driftState{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%) scale(0.9);padding:8px 22px;border-radius:999px;background:linear-gradient(135deg, rgba(255,154,90,0.95), rgba(220,60,40,0.9));color:#1c1420;font-size:15px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 4px 22px rgba(255,154,90,0.6);opacity:0;transition:opacity .15s ease-out, transform .15s cubic-bezier(0.175, 0.885, 0.32, 1.275);pointer-events:none;z-index:30}
#driftState.active{opacity:1;transform:translateX(-50%) scale(1.08)}

/* ===== RESPONSIVE MOBILE TOUCH CONTROLS ===== */
#mobileControls{display:none;position:fixed;inset:0;z-index:25;pointer-events:none;touch-action:none;user-select:none;-webkit-user-select:none}
.touchCluster{position:absolute;display:flex;gap:10px;pointer-events:auto;touch-action:none}

#steerPad{left:max(14px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));align-items:flex-end}
#actionPad{right:max(14px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,auto);gap:10px;align-items:end}

.touchBtn{
  width:clamp(62px,12vw,92px);
  height:clamp(62px,12vw,92px);
  border-radius:50%;
  border:1.5px solid rgba(255,255,255,0.4);
  background:rgba(32,23,37,0.55);
  color:#fff3e2;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:0 6px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:clamp(12px,2.4vw,16px);
  line-height:1.1;
  text-align:center;
  padding:0;
  cursor:pointer;
  touch-action:none;
  transition:background 0.08s, transform 0.08s, border-color 0.08s, box-shadow 0.08s;
}

.touchBtn:active, .touchBtn.active{
  background:rgba(255,179,107,0.85) !important;
  color:#241526 !important;
  border-color:#ffffff !important;
  transform:scale(0.93);
  box-shadow:0 2px 10px rgba(255,154,90,0.6), inset 0 0 12px rgba(255,255,255,0.8);
}

.touchBtn.driftBtn{
  background:rgba(220,70,40,0.45);
  border-color:rgba(255,154,90,0.6);
  color:#ffebd8;
}
.touchBtn.driftBtn:active, .touchBtn.driftBtn.active{
  background:linear-gradient(135deg, #ff9a5a, #dc3c28) !important;
  color:#ffffff !important;
}

#mobileUtility{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:max(14px,env(safe-area-inset-top,0px));display:flex;gap:8px;pointer-events:auto}
.miniBtn{width:42px;height:42px;border-radius:10px;font-size:16px;background:rgba(32,23,37,0.65);color:#fff;border:1px solid rgba(255,255,255,0.35)}

/* Portrait Mode Orientation Notice */
#portraitNotice{display:none;position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:6px 14px;border-radius:20px;background:rgba(28,20,32,0.88);color:#ffc9a0;font-size:12px;font-weight:600;border:1px solid rgba(255,179,107,0.3);backdrop-filter:blur(6px);z-index:35;pointer-events:none;text-align:center;white-space:nowrap}

/* Media Queries for Mobile/Touch Devices */
@media (hover:none) and (pointer:coarse), (max-width:850px){
  #mobileControls{display:block}
  #ctl{display:none}
  #hud{right:14px;bottom:calc(118px + env(safe-area-inset-bottom,0px));transform:scale(0.88);transform-origin:right bottom}
  #spd{font-size:clamp(36px,8vw,54px)}
  #tag{font-size:11px;padding:5px 9px}
}

@media (orientation:portrait) and (max-width:850px){
  #portraitNotice{display:block}
}
</style></head><body>

<div id="tag">Sunset Rider – SAM WORLD Racing Edition</div>
<div id="portraitNotice">📱 Rotate device to landscape for best experience</div>
<div id="hud"><div id="spd">0</div><small>km/h</small></div>
<div id="ctl">W/↑ accelerate · S/↓ brake/reverse · A/D or ←/→ steer · Space drift/handbrake · R reset · Esc/P pause · M mute</div>

<div id="ov">
  <h1>Sunset Rider</h1>
  <p>SAM WORLD Arcade Racing Edition. Hold DRIFT + Steer to slide!</p>
  <button id="go">Start Game</button>
</div>

<div id="pz">Paused</div>
<div id="driftState">💨 DRIFT</div>

<!-- TOUCH CONTROLS OVERLAY -->
<div id="mobileControls" aria-label="Mobile Touch Controls">
  <!-- Steering Left Side -->
  <div id="steerPad" class="touchCluster">
    <button class="touchBtn" data-key="ArrowLeft" aria-label="Steer Left">◀</button>
    <button class="touchBtn" data-key="ArrowRight" aria-label="Steer Right">▶</button>
  </div>

  <!-- Action Right Side -->
  <div id="actionPad" class="touchCluster">
    <button class="touchBtn driftBtn" data-key="Space" aria-label="Handbrake Drift" style="grid-column:1 / span 2; width:100%; height:clamp(48px,9vw,68px); border-radius:30px;">💨 DRIFT</button>
    <button class="touchBtn" data-key="ArrowUp" aria-label="Accelerate">ACCEL</button>
    <button class="touchBtn" data-key="ArrowDown" aria-label="Brake Reverse">BRAKE</button>
  </div>

  <!-- Utility Bar Top Right -->
  <div id="mobileUtility">
    <button class="touchBtn miniBtn" id="mReset" aria-label="Reset Vehicle">↻</button>
    <button class="touchBtn miniBtn" id="mPause" aria-label="Pause Game">Ⅱ</button>
    <button class="touchBtn miniBtn" id="mFull" aria-label="Toggle Fullscreen">⛶</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,V=(x,y,z)=>new T.Vector3(x,y,z);
const scene=new T.Scene();scene.fog=new T.Fog(0xf0a070,90,420);
const cam=new T.PerspectiveCamera(50,1,.1,900);
const R=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.shadowMap.enabled=true;
document.body.appendChild(R.domElement);

function rs(){
  R.setSize(innerWidth,innerHeight);
  cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix();
}
addEventListener('resize',rs);rs();

// ===== SKY & SUN =====
const SD=V(-80,30,-60).normalize();
const sky=(()=>{
  const g=new T.SphereGeometry(600,24,16),p=g.attributes.position,c=[],top=new T.Color(0x3a4a86),mid=new T.Color(0xff8f55),low=new T.Color(0xffd08a);
  for(let i=0;i<p.count;i++){const h=p.getY(i)/600;const k=h<0?low.clone():h<.3?low.clone().lerp(mid,h/.3):mid.clone().lerp(top,Math.min(1,(h-.3)/.6));c.push(k.r,k.g,k.b)}
  g.setAttribute('color',new T.Float32BufferAttribute(c,3));
  const m=new T.Mesh(g,new T.MeshBasicMaterial({vertexColors:true,side:T.BackSide,fog:false}));
  const sun=new T.Mesh(new T.SphereGeometry(28,16,12),new T.MeshBasicMaterial({color:0xffe6a8,fog:false}));
  sun.position.copy(SD).multiplyScalar(560);m.add(sun);scene.add(m);return m;
})();
scene.add(new T.HemisphereLight(0xffc9a0,0x4a3a5a,.7));
const dl=new T.DirectionalLight(0xffa860,1.5);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);
Object.assign(dl.shadow.camera,{left:-40,right:40,top:40,bottom:-40,near:1,far:300});dl.shadow.bias=-.0005;scene.add(dl,dl.target);

// ===== GROUND & ROADS =====
const gm=(c,y,w,l,x,z,r)=>{const m=new T.Mesh(new T.PlaneGeometry(w,l),new T.MeshStandardMaterial({color:c,roughness:.9}));m.rotation.x=-Math.PI/2;m.rotation.z=r||0;m.position.set(x,y,z);m.receiveShadow=true;scene.add(m)};
gm(0x8c7a6c,-.02,1400,1400,0,0);
for(let k=-3;k<=3;k++){gm(0x2b2b31,.01,12,440,k*60,0);gm(0xe8c860,.03,.25,440,k*60,0);gm(0x2b2b31,.015,12,440,0,k*60,Math.PI/2);gm(0xe8c860,.035,.25,440,0,k*60,Math.PI/2)}

// ===== BUILDINGS =====
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const B=[],tc=document.createElement('canvas');tc.width=64;tc.height=128;{const c=tc.getContext('2d');c.fillStyle='#b9b4c4';c.fillRect(0,0,64,128);
for(let y=4;y<124;y+=10)for(let x=5;x<58;x+=9){c.fillStyle=rnd()<.35?'#ffd58a':'#4f5a78';c.fillRect(x,y,5,6)}}
const bm=new T.InstancedMesh(new T.BoxGeometry(1,1,1).translate(0,.5,0),new T.MeshStandardMaterial({map:new T.CanvasTexture(tc),roughness:.35,metalness:.3}),80);
bm.castShadow=true;let bi=0;const dm=new T.Object3D(),cols=[0xd9b8a0,0xb0a8c8,0xc9c0b0,0x9fb3c8,0xe0a890];
for(let i=-3;i<=2;i++)for(let j=-3;j<=2;j++){const n=rnd()<.5?1:2;for(let q=0;q<n;q++){
 const hx=n==1?8+rnd()*11:6+rnd()*5,hz=n==1?8+rnd()*11:6+rnd()*5,h=10+rnd()*45;
 const x=(i+.5)*60+(n==2?(q?11:-11):0),z=(j+.5)*60;const hx2=n==2?7:hx;
 B.push({x,z,hx:hx2,hz});dm.position.set(x,0,z);dm.scale.set(hx2*2,h,hz*2);dm.updateMatrix();bm.setMatrixAt(bi,dm.matrix);bm.setColorAt(bi++,new T.Color(cols[Math.floor(rnd()*5)]))}}
bm.count=bi;scene.add(bm);

// ==================================================
// RACING SIGNAGE & TEXTURE HELPER FACTORY
// ==================================================
function createSignTexture(w, h, title, subtitle="", opts={}){
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');

  // Background Gradient
  const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
  bgGrad.addColorStop(0, opts.bg1 || '#0b0814');
  bgGrad.addColorStop(1, opts.bg2 || '#1a1028');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, w, h);

  // Speed Line Accents
  ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
  for (let x = -w; x < w * 2; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x + 30, 0);
    ctx.lineTo(x - 20, h); ctx.lineTo(x - 50, h);
    ctx.fill();
  }

  // Checkered Flag Accent Bars
  if (opts.checkered) {
    const cw = 14;
    for (let y = 0; y < h; y += cw) {
      for (let xOffset of [0, w - cw]) {
        ctx.fillStyle = (Math.floor(y / cw) % 2 === 0) ? '#ffffff' : '#000000';
        ctx.fillRect(xOffset, y, cw, cw);
      }
    }
  }

  // Neon Rim Borders
  ctx.strokeStyle = opts.border || '#ff9a5a';
  ctx.lineWidth = opts.borderWidth || 8;
  ctx.strokeRect(4, 4, w - 8, h - 8);

  if (opts.innerBorder) {
    ctx.strokeStyle = opts.innerBorder;
    ctx.lineWidth = 3;
    ctx.strokeRect(12, 12, w - 24, h - 24);
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Title Text
  ctx.font = opts.titleFont || 'italic 900 48px "Impact", "Trebuchet MS", sans-serif';
  ctx.fillStyle = opts.titleColor || '#ffffff';
  ctx.shadowColor = opts.glowColor || '#ff8040';
  ctx.shadowBlur = opts.glowBlur || 22;
  ctx.fillText(title, w / 2, subtitle ? h * 0.42 : h * 0.5);

  // Subtitle Text
  if (subtitle) {
    ctx.font = opts.subFont || 'italic 800 22px "Trebuchet MS", sans-serif';
    ctx.fillStyle = opts.subColor || '#00f0ff';
    ctx.shadowColor = opts.subGlow || '#00bfff';
    ctx.shadowBlur = 14;
    ctx.fillText(subtitle, w / 2, h * 0.76);
  }

  return new T.CanvasTexture(cv);
}

// Common Metallic Materials
const pillarMat = new T.MeshStandardMaterial({color: 0x22252a, metalness: 0.85, roughness: 0.25});
const trussMat = new T.MeshStandardMaterial({color: 0x3a3f47, metalness: 0.75, roughness: 0.35});
const frameMat = new T.MeshStandardMaterial({color: 0x120e18, metalness: 0.5, roughness: 0.5});
const neonGlowMat = new T.MeshBasicMaterial({color: 0xff9a5a});

// ==================================================
// 1. MAIN "SAM WORLD" OVERHEAD BILLBOARD
// ==================================================
const bbCanvas = document.createElement('canvas');
bbCanvas.width = 1024; bbCanvas.height = 512;
const ctxBB = bbCanvas.getContext('2d');

// Dark Tech Background
const bgGrad = ctxBB.createLinearGradient(0, 0, 0, 512);
bgGrad.addColorStop(0, '#090610');
bgGrad.addColorStop(0.5, '#1b1228');
bgGrad.addColorStop(1, '#090610');
ctxBB.fillStyle = bgGrad;
ctxBB.fillRect(0, 0, 1024, 512);

// Speed Lines
ctxBB.strokeStyle = 'rgba(255, 154, 90, 0.12)';
ctxBB.lineWidth = 3;
for(let y = 20; y < 500; y += 32) {
  ctxBB.beginPath(); ctxBB.moveTo(0, y); ctxBB.lineTo(1024, y); ctxBB.stroke();
}
ctxBB.fillStyle = 'rgba(255, 255, 255, 0.03)';
for (let x = -200; x < 1200; x += 60) {
  ctxBB.beginPath(); ctxBB.moveTo(x, 0); ctxBB.lineTo(x + 100, 0); ctxBB.lineTo(x - 50, 512); ctxBB.lineTo(x - 150, 512); ctxBB.fill();
}

// Illuminated Borders
ctxBB.strokeStyle = '#ff9a5a'; ctxBB.lineWidth = 16;
ctxBB.strokeRect(10, 10, 1004, 492);
ctxBB.strokeStyle = '#00d5ff'; ctxBB.lineWidth = 5;
ctxBB.strokeRect(22, 22, 980, 468);

ctxBB.textAlign = 'center';
ctxBB.textBaseline = 'middle';

// WELCOME TO
ctxBB.font = 'italic 900 44px "Trebuchet MS", sans-serif';
ctxBB.fillStyle = '#ffb36b';
ctxBB.shadowColor = '#ff9a5a'; ctxBB.shadowBlur = 18;
ctxBB.fillText('WELCOME TO', 512, 100);

// SAM WORLD (Main Headline)
ctxBB.font = 'italic 900 122px "Impact", "Trebuchet MS", sans-serif';
const textGrad = ctxBB.createLinearGradient(0, 170, 0, 310);
textGrad.addColorStop(0, '#ffffff');
textGrad.addColorStop(0.4, '#ffe4b0');
textGrad.addColorStop(1, '#ff6000');
ctxBB.fillStyle = textGrad;
ctxBB.shadowColor = '#ff5500'; ctxBB.shadowBlur = 40;
ctxBB.fillText('SAM WORLD', 512, 230);

// Subtitle (EXACT TEXT PRESERVED)
ctxBB.font = '800 28px "Trebuchet MS", sans-serif';
ctxBB.fillStyle = '#00f0ff';
ctxBB.shadowColor = '#00bfff'; ctxBB.shadowBlur = 16;
ctxBB.fillText("WE'R WORKING ON THE DEVELOPMENT OF THE GAME", 512, 380);

const mainBBTexture = new T.CanvasTexture(bbCanvas);

// 3D Billboard Group
const mainGantry = new T.Group();
mainGantry.position.set(0, 0, 20); // Spans center road facing player

const leftPillar = new T.Mesh(new T.CylinderGeometry(0.35, 0.4, 11, 16), pillarMat);
leftPillar.position.set(-9.5, 5.5, 0);
leftPillar.castShadow = true; leftPillar.receiveShadow = true;
mainGantry.add(leftPillar);

const rightPillar = new T.Mesh(new T.CylinderGeometry(0.35, 0.4, 11, 16), pillarMat);
rightPillar.position.set(9.5, 5.5, 0);
rightPillar.castShadow = true; rightPillar.receiveShadow = true;
mainGantry.add(rightPillar);

const topTruss = new T.Mesh(new T.BoxGeometry(20, 0.45, 0.45), trussMat);
topTruss.position.set(0, 10.8, 0); topTruss.castShadow = true;
mainGantry.add(topTruss);

const midTruss = new T.Mesh(new T.BoxGeometry(20, 0.45, 0.45), trussMat);
midTruss.position.set(0, 5.8, 0); midTruss.castShadow = true;
mainGantry.add(midTruss);

const bbFrame = new T.Mesh(new T.BoxGeometry(16.4, 5.6, 0.6), frameMat);
bbFrame.position.set(0, 8.4, 0); bbFrame.castShadow = true; bbFrame.receiveShadow = true;
mainGantry.add(bbFrame);

const bbRim = new T.Mesh(new T.BoxGeometry(16.6, 5.8, 0.08), neonGlowMat);
bbRim.position.set(0, 8.4, -0.26);
mainGantry.add(bbRim);

const mainBBMat = new T.MeshStandardMaterial({
  map: mainBBTexture,
  emissiveMap: mainBBTexture,
  emissive: new T.Color(0xffffff),
  emissiveIntensity: 0.45,
  roughness: 0.3, metalness: 0.2
});

const bbPanel = new T.Mesh(new T.PlaneGeometry(16, 5.2), mainBBMat);
bbPanel.position.set(0, 8.4, -0.31);
bbPanel.rotation.y = Math.PI;
bbPanel.receiveShadow = true;
mainGantry.add(bbPanel);

const bbPanelBack = new T.Mesh(new T.PlaneGeometry(16, 5.2), mainBBMat);
bbPanelBack.position.set(0, 8.4, 0.31);
mainGantry.add(bbPanelBack);

// Top Mounted Floodlights
const lampMat = new T.MeshStandardMaterial({color: 0x111113, metalness: 0.9, roughness: 0.2});
const lampGlowMat = new T.MeshBasicMaterial({color: 0xfff0cc});
for (let x = -6; x <= 6; x += 4) {
  const arm = new T.Mesh(new T.CylinderGeometry(0.05, 0.05, 1.1, 8), trussMat);
  arm.position.set(x, 11.2, -0.4); arm.rotation.x = Math.PI / 3;
  mainGantry.add(arm);

  const head = new T.Mesh(new T.ConeGeometry(0.3, 0.45, 12), lampMat);
  head.position.set(x, 11.45, -0.8); head.rotation.x = -Math.PI / 4;
  mainGantry.add(head);

  const bulb = new T.Mesh(new T.SphereGeometry(0.16, 12, 8), lampGlowMat);
  bulb.position.set(x, 11.35, -0.85);
  mainGantry.add(bulb);

  const spot = new T.SpotLight(0xffe0b0, 1.2, 14, Math.PI / 4, 0.5, 1);
  spot.position.set(x, 11.35, -0.9); spot.target = bbPanel;
  mainGantry.add(spot);
}
scene.add(mainGantry);
B.push({x: -9.5, z: 20, hx: 0.5, hz: 0.5}, {x: 9.5, z: 20, hx: 0.5, hz: 0.5});

// ==================================================
// 2. RACING CITY SIGNAGE & CHECKPOINT ARCHES SYSTEM
// ==================================================

// Helper: Roadside Standing Billboard
function addRoadsideBillboard(x, z, rotY, title, subtitle, opts={}) {
  const grp = new T.Group();
  grp.position.set(x, 0, z);
  grp.rotation.y = rotY;

  const width = opts.w || 7.0;
  const height = opts.h || 3.5;
  const poleH = opts.poleH || 5.0;

  const tex = createSignTexture(512, 256, title, subtitle, opts);
  const mat = new T.MeshStandardMaterial({
    map: tex, emissiveMap: tex, emissive: new T.Color(0xffffff), emissiveIntensity: 0.4, roughness: 0.35
  });

  // Center Post
  const pole = new T.Mesh(new T.CylinderGeometry(0.2, 0.25, poleH, 12), pillarMat);
  pole.position.y = poleH / 2;
  pole.castShadow = true; pole.receiveShadow = true;
  grp.add(pole);

  // Board Frame
  const frame = new T.Mesh(new T.BoxGeometry(width + 0.3, height + 0.3, 0.25), frameMat);
  frame.position.y = poleH + height / 2;
  frame.castShadow = true;
  grp.add(frame);

  // Front & Back Panels
  const pFront = new T.Mesh(new T.PlaneGeometry(width, height), mat);
  pFront.position.set(0, poleH + height / 2, 0.14);
  grp.add(pFront);

  const pBack = new T.Mesh(new T.PlaneGeometry(width, height), mat);
  pBack.position.set(0, poleH + height / 2, -0.14);
  pBack.rotation.y = Math.PI;
  grp.add(pBack);

  scene.add(grp);
  B.push({x, z, hx: 0.4, hz: 0.4});
}

// Helper: Building Mounted Poster / Sign

// ===== ADVANCED MULTI-TOUCH POINTER SYSTEM =====
const activePointers = new Map();
const touchKeys = new Set();

function updateButtonVisuals() {
  document.querySelectorAll('.touchBtn[data-key]').forEach(btn => {
    const key = btn.dataset.key;
    if (touchKeys.has(key)) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
}

function reevaluatePointers() {
  touchKeys.clear();
  activePointers.forEach((key) => {
    if (key) touchKeys.add(key);
  });
  updateButtonVisuals();
}

function handlePointerDown(e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const btn = e.target.closest('.touchBtn[data-key]');
  if (btn) {
    e.preventDefault();
    const key = btn.dataset.key;
    activePointers.set(e.pointerId, key);
    reevaluatePointers();
    if (phase === 'menu') start();
  }
}

function handlePointerMove(e) {
  if (!activePointers.has(e.pointerId)) return;
  e.preventDefault();
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const btn = el ? el.closest('.touchBtn[data-key]') : null;
  const key = btn ? btn.dataset.key : null;
  if (activePointers.get(e.pointerId) !== key) {
    activePointers.set(e.pointerId, key);
    reevaluatePointers();
  }
}

function handlePointerUp(e) {
  if (activePointers.has(e.pointerId)) {
    e.preventDefault();
    activePointers.delete(e.pointerId);
    reevaluatePointers();
  }
}

// ===== AUDIO SYSTEM =====
let ac,osc,gn,screechGain,screechFilter,mute=false;
function audio(){
  if(ac)return;
  ac=new(window.AudioContext||window.webkitAudioContext)();
  osc=ac.createOscillator();osc.type='sawtooth';
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=600;
  gn=ac.createGain();gn.gain.value=0;
  osc.connect(f);f.connect(gn);gn.connect(ac.destination);osc.start();
  setupScreech();
}

function setupScreech(){
  if(!ac||screechGain)return;
  try{
    const bufferSize=ac.sampleRate*2;
    const noiseBuffer=ac.createBuffer(1,bufferSize,ac.sampleRate);
    const output=noiseBuffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++)output[i]=Math.random()*2-1;
    const whiteNoise=ac.createBufferSource();
    whiteNoise.buffer=noiseBuffer;whiteNoise.loop=true;
    screechFilter=ac.createBiquadFilter();screechFilter.type='bandpass';
    screechFilter.frequency.value=1100;screechFilter.Q.value=2.5;
    screechGain=ac.createGain();screechGain.gain.value=0;
    whiteNoise.connect(screechFilter);screechFilter.connect(screechGain);screechGain.connect(ac.destination);
    whiteNoise.start();
  }catch(_){}
}

function updateScreech(drift,speed,driftAngle){
  if(!screechGain)setupScreech();
  if(screechGain&&ac){
    const targetGain=(mute||drift<.1)?0:Math.min(.22,drift*.20*Math.min(1,speed/8));
    screechGain.gain.setTargetAtTime(targetGain,ac.currentTime,.05);
    if(screechFilter)screechFilter.frequency.setTargetAtTime(900+Math.abs(driftAngle)*700+speed*15,ac.currentTime,.05);
  }
}

function bump(){if(!ac||mute)return;const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=70;g.gain.setValueAtTime(.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.35);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.35)}

// ===== PHYSICS & MOTORCYCLE SIMULATION STEP =====
function step(dt){
  let thr=(keys.KeyW||keys.ArrowUp||touchKeys.has('ArrowUp')||touchKeys.has('KeyW'))?1:0;
  let br=(keys.KeyS||keys.ArrowDown||touchKeys.has('ArrowDown')||touchKeys.has('KeyS'))?1:0;
  let sti=((keys.KeyA||keys.ArrowLeft||touchKeys.has('ArrowLeft')||touchKeys.has('KeyA'))?1:0)-((keys.KeyD||keys.ArrowRight||touchKeys.has('ArrowRight')||touchKeys.has('KeyD'))?1:0);
  let hb=(keys.Space||touchKeys.has('Space'))?1:0;

  if(!ctl){thr=br=sti=hb=0;if(auto)thr=1}

  if(S.crash>0){
    S.crash-=dt;S.v*=Math.exp(-3*dt);
    S.lean+=(1.45*S.cs-S.lean)*Math.min(1,dt*5);
    if(S.crash<=0)reset();
  }else{
    const speedKmh=Math.abs(S.v)*3.6;
    const hasSteer=Math.abs(sti)>.05;
    const driftRequested=(hb||br)&&hasSteer&&speedKmh>=26;

    if(driftRequested){
      S.drift=Math.min(1.0,S.drift+dt*4.0);
    }else{
      S.drift=Math.max(0.0,S.drift-dt*3.5);
    }

    const isDrifting=S.drift>.08;

    const VM=42;let a=0;
    if(thr)a=S.v<0?20:10*(1-Math.max(0,S.v)/VM)+2.0;
    if(br&&!driftRequested)a=S.v>.5?-24:(S.v>-5?-5:0);
    if(!thr&&!br&&!hb)a-=Math.sign(S.v)*1.2;

    if(isDrifting){
      if(thr)a-=2.2*S.drift;
      else a-=6.8*S.drift;
    }

    S.v+=a*dt;
    if(!thr&&!br&&!hb&&Math.abs(S.v)<.2)S.v=0;

    const maxSteer=.52;
    const steerSpeedScale=1.0/(1.0+Math.abs(S.v)/12.0);
    const targetSteer=sti*maxSteer*(isDrifting?1.2:1.0)*steerSpeedScale;
    S.steer+=(targetSteer-S.steer)*Math.min(1,dt*10);

    const maxDriftAngle=1.02;
    const targetDriftAngle=-sti*maxDriftAngle*S.drift;
    S.driftAngle+=(targetDriftAngle-S.driftAngle)*Math.min(1,dt*6.5);

    let turnRate=0;
    if(isDrifting){
      turnRate=sti*(1.8+S.drift*1.4)*Math.sign(S.v>=0?1:-1);
      if(hb&&!thr)turnRate*=1.35;
    }else{
      turnRate=S.v*Math.tan(S.steer)/1.35;
    }

    S.th+=turnRate*dt;

    if(isDrifting){
      const targetMoveAng=S.th+S.driftAngle*.75;
      let angDiff=targetMoveAng-S.moveAng;
      angDiff=Math.atan2(Math.sin(angDiff),Math.cos(angDiff));
      S.moveAng+=angDiff*Math.min(1,dt*5.0);
    }else{
      let angDiff=S.th-S.moveAng;
      angDiff=Math.atan2(Math.sin(angDiff),Math.cos(angDiff));
      S.moveAng+=angDiff*Math.min(1,dt*10.0);
    }

    S.x+=Math.sin(S.moveAng)*S.v*dt;
    S.z+=Math.cos(S.moveAng)*S.v*dt;

    const cornerLean=-Math.atan(turnRate*Math.abs(S.v)/9.8)*.75;
    const slideLean=S.driftAngle*.35;
    const targetLean=Math.max(-.85,Math.min(.85,cornerLean+slideLean));
    S.lean+=(targetLean-S.lean)*Math.min(1,dt*7.5);

    for(const b of B){
      const cx=Math.max(b.x-b.hx,Math.min(S.x,b.x+b.hx)),cz=Math.max(b.z-b.hz,Math.min(S.z,b.z+b.hz));
      let dx=S.x-cx,dz=S.z-cz,d=Math.hypot(dx,dz);
      if(d<.5){
        if(d<1e-4){dx=1;dz=0;d=1}S.x+=dx/d*(.5-d);S.z+=dz/d*(.5-d);
        bump();
        if(Math.abs(S.v)>16){S.crash=1.8;S.cs=Math.random()<.5?1:-1}else S.v*=-.3;
      }
    }

    S.fork+=((br&&S.v>1?.07:0)-S.fork)*Math.min(1,dt*10);
    S.pitch+=(((br&&S.v>1)?.04:0)-(thr&&S.v<20?.03:0)-S.pitch)*Math.min(1,dt*8);

    const rearDist=.68;
    const rearX=S.x-Math.sin(S.th)*rearDist;
    const rearZ=S.z-Math.cos(S.th)*rearDist;

    if(isDrifting&&Math.abs(S.v)>5){
      const smokeCount=Math.ceil(S.drift*2);
      for(let k=0;k<smokeCount;k++)spawnSmoke(rearX,rearZ,S.th,S.v,S.driftAngle);

      skidTimer-=dt;
      if(skidTimer<=0){
        spawnSkid(rearX,rearZ,S.th+S.driftAngle*.5);
        skidTimer=.06;
      }
    }else{
      skidTimer=0;
    }

    S.shake=S.drift*Math.min(1.0,speedKmh/50.0);
    updateScreech(S.drift,Math.abs(S.v),S.driftAngle);
  }

  root.position.set(S.x,0,S.z);
  root.rotation.y=S.th;
  lean.rotation.z=S.lean;
  lean.rotation.x=S.pitch;
  us.position.y=S.fork;
  st.rotation.y=S.steer;

  const wheelRot=S.v*dt/.34;
  fw.rotation.x+=wheelRot;
  rw.rotation.x+=wheelRot;

  rider.rotation.x+=(Math.max(-.16,Math.min(.12,(thr?.10:0)+(br?.08:0)))-rider.rotation.x)*Math.min(1,dt*6);
  rider.rotation.z+=((S.lean*.55+S.driftAngle*.25)-rider.rotation.z)*Math.min(1,dt*7);

  updateDriftFx(dt);
  updateDriftHUD(S.drift,S.driftAngle,Math.abs(S.v)*3.6);

  if(ac){
    const av=Math.abs(S.v),f=50+((av%9)/9)*70+Math.floor(av/9)*8;
    osc.frequency.setTargetAtTime(f,ac.currentTime,.05);
    gn.gain.setTargetAtTime(mute?0:.03+.05*thr+.01*Math.min(1,av/40),ac.currentTime,.05);
  }
}

function updateDriftHUD(drift,driftAngle,speedKmh){
  const ds=document.getElementById('driftState');
  if(drift>.15){
    ds.classList.add('active');
    const angleDeg=Math.round(Math.abs(driftAngle)*57.3);
    if(angleDeg>40){
      ds.textContent='🔥 180° DRIFT TURN!';
    }else if(speedKmh>55){
      ds.textContent='⚡ HIGH SPEED DRIFT!';
    }else{
      ds.textContent='💨 DRIFT '+angleDeg+'°';
    }
  }else{
    ds.classList.remove('active');
  }
}

const ss=x=>x*x*(3-2*x);
const look=V(0,0,0);

function camUpdate(dt){
  const f=V(Math.sin(S.th),0,Math.cos(S.th));
  const p=V(S.x,0,S.z);
  const av=Math.abs(S.v);

  const chaseDist=4.4+av*.05+S.drift*.8;
  const chase=p.clone().addScaledVector(f,-chaseDist);
  chase.y=1.7+av*.006;

  const baseFov=62+Math.min(av,42)*.4+(S.drift*12.0);
  let s=1;

  if(phase=='intro'){
    const off=V(-2.4,1.0,2.6).applyAxisAngle(V(0,1,0),Math.min(it,4.5)*.07);
    const cine=V(S0.x,0,S0.z).add(off);
    s=ss(Math.max(0,Math.min(1,(it-4.5)/3.5)));
    cam.position.copy(cine).lerp(chase,s);
    cam.fov=40+(baseFov-40)*s;
    look.copy(p).add(V(0,.6+.4*s,0)).addScaledVector(f,3*s);
    if(it>=8)phase='play';
  }else{
    cam.position.lerp(chase,1-Math.exp(-dt*6));
    cam.fov+=(baseFov-cam.fov)*Math.min(1,dt*4);

    if(S.shake>.05||av>25){
      const shakeAmt=(S.shake*.12)+(av>25?(av-25)*.0015:0);
      cam.position.x+=(Math.random()-.5)*shakeAmt;
      cam.position.y+=(Math.random()-.5)*shakeAmt;
      cam.position.z+=(Math.random()-.5)*shakeAmt;
    }

    look.lerp(p.clone().add(V(0,1,0)).addScaledVector(f,3),1-Math.exp(-dt*8));
  }

  cam.updateProjectionMatrix();
  cam.lookAt(look);
  cam.rotateZ(-S.lean*.15+S.driftAngle*.10);
}

const spd=document.getElementById('spd');
let last=performance.now();
S.th=0;S.moveAng=0;
root.position.set(S.x,0,S.z);

function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(phase!='menu'&&!paused){it+=dt;ctl=it>=4.5;auto=it>=4.5&&it<6.5;step(dt)}
  if(phase=='menu'){
    const o=V(-2.4,1,2.6).applyAxisAngle(V(0,1,0),t*.00008);
    cam.position.set(S0.x+o.x,o.y,S0.z+o.z);
    cam.fov=40;cam.updateProjectionMatrix();cam.lookAt(S0.x,.6,S0.z);
  }else camUpdate(dt);

  spd.textContent=Math.round(Math.abs(S.v)*3.6);
  sky.position.copy(cam.position);
  dl.position.set(S.x+SD.x*100,SD.y*100,S.z+SD.z*100);
  dl.target.position.set(S.x,0,S.z);
  R.render(scene,cam);
}
requestAnimationFrame(loop);
</script></body></html>
